id = "jjliebig.simple-dispatch"
name = "Simple Dispatch"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Start feature work and issue fixes, or shepherd existing pull requests to a mergeable state, in isolated workspaces for Codex, opencode, and other Herdr agents."
platforms = ["windows"]

[[actions]]
id = "issue-to-pr"
title = "Issue or pull request"
contexts = ["workspace", "tab", "pane"]
command = ["node", "controller.js", "start"]

[[actions]]
id = "feature-to-pr"
title = "Feature or fix"
contexts = ["workspace", "tab", "pane"]
command = ["node", "controller.js", "start", "task"]

[[actions]]
id = "cleanup-current-workflow"
title = "Clean up current Codex workflow"
contexts = ["workspace", "tab", "pane"]
command = ["node", "controller.js", "cleanup"]

[[panes]]
id = "input"
title = "Workflow"
placement = "popup"
width = "70%"
height = 12
command = ["node", "controller.js", "popup"]

[[panes]]
id = "progress"
title = "Starting workflow"
placement = "split"
command = ["node", "controller.js", "progress"]

[[panes]]
id = "confirm"
title = "Remove worktree?"
placement = "popup"
width = "60%"
height = 9
command = ["node", "controller.js", "confirm"]
